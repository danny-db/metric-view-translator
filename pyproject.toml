[project]
name = "dax-translator"
version = "0.1.0"
description = "Translate Power BI DAX measures into Databricks Metric View definitions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "databricks-sdk>=0.36.0",
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dax-translate = "dax_translator.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dax_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Databricks connectivity",
]

